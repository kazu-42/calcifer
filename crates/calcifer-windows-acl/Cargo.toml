[package]
name = "calcifer-windows-acl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Internal handle-bound Windows current-user-only ACL access for Calcifer"
license = "MIT"
repository = "https://github.com/kazu-42/calcifer"
publish = ["crates-io"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
