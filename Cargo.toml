[package]
name = "calcifer"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.85"
description = "Pre-alpha local-first wrapper for isolated coding-agent CLI profiles"
license = "MIT"
repository = "https://github.com/kazu-42/calcifer"
homepage = "https://github.com/kazu-42/calcifer"
readme = "README.md"
keywords = ["cli", "codex", "claude", "profiles", "automation"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/build.rs",
    "/src/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix}"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext}"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWScrwKKsqmN5v9pAGdgdW0jNSHokfmerI53KJiE2gRNmcaNS36gOtC6"

[features]
default = ["production-supervisor"]
production-supervisor = ["dep:log", "dep:tungstenite"]
internal-supervisor-fixture = ["production-supervisor"]
internal-failover-scorecard = ["production-supervisor"]

[[bin]]
name = "calcifer-supervisor-fixture"
path = "src/bin/calcifer-supervisor-fixture.rs"
required-features = ["internal-supervisor-fixture"]

[[test]]
name = "supervisor"
path = "tests/supervisor.rs"
required-features = ["internal-supervisor-fixture"]

[workspace]
members = [
    "crates/calcifer-macos-acl",
    "crates/calcifer-unix-child-fd",
    "crates/calcifer-windows-acl",
]
default-members = [
    ".",
    "crates/calcifer-macos-acl",
    "crates/calcifer-unix-child-fd",
    "crates/calcifer-windows-acl",
]
resolver = "3"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
fs2 = "0.4.3"
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.32", default-features = false, features = ["std"] }
# Tungstenite renders raw frames at `trace`. When the production supervisor is
# compiled, compile the `log` facade out so a future logger cannot expose
# provider payloads before Calcifer's typed redaction boundary. Keeping this
# dependency feature-scoped preserves no-default-features builds.
log = { version = "0.4.33", optional = true, features = ["max_level_off", "release_max_level_off"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
sha2 = "0.11.0"
subtle = "2.6.1"
toml = "1.1.3"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.23.5", features = ["v4"] }
which = "8.0.4"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
calcifer-unix-child-fd = { version = "0.1.0", path = "crates/calcifer-unix-child-fd" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "pty", "termios"] }
signal-hook = "0.4.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tungstenite = { version = "0.30.0", optional = true, default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "macos")'.dependencies]
calcifer-macos-acl = { version = "0.1.0", path = "crates/calcifer-macos-acl" }
exacl = "0.13.0"

[target.'cfg(windows)'.dependencies]
calcifer-windows-acl = { version = "0.1.0", path = "crates/calcifer-windows-acl" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"
