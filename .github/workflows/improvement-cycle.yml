name: Continuous improvement cycle

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

env:
  SNAPSHOT_SCHEMA: calcifer-improvement-cycle-snapshot:v2

concurrency:
  group: calcifer-improvement-cycle
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'kazu-42/calcifer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect and render public repository health
        id: snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          issues="${RUNNER_TEMP:?}/improvement-cycle-issues.json"
          runs="${RUNNER_TEMP:?}/improvement-cycle-runs.json"
          releases="${RUNNER_TEMP:?}/improvement-cycle-releases.json"
          body="${RUNNER_TEMP:?}/improvement-cycle-body.md"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" > "${issues}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" > "${runs}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${releases}"

          python3 scripts/improvement_cycle.py \
            --repository "${GITHUB_REPOSITORY}" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --issues-json "${issues}" \
            --runs-json "${runs}" \
            --releases-json "${releases}" \
            --body "${body}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Comment on the active cycle once per day
        if: steps.snapshot.outputs.mode == 'comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.snapshot.outputs.issue_number }}
          MARKER: ${{ steps.snapshot.outputs.marker }}
        run: |
          set -euo pipefail

          issue_number="${ISSUE_NUMBER:?}"
          marker="${MARKER:?}"
          body="${RUNNER_TEMP:?}/improvement-cycle-body.md"
          comments="${RUNNER_TEMP:?}/improvement-cycle-comments.json"
          case "${issue_number}" in
            ''|*[!0-9]*) echo "Invalid issue number" >&2; exit 2 ;;
          esac
          case "${marker}" in
            "${SNAPSHOT_SCHEMA} date="????-??-??) ;;
            *) echo "Invalid snapshot marker" >&2; exit 2 ;;
          esac

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments?per_page=100" > "${comments}"
          already_exists="$(
            jq -r \
              --arg marker "<!-- ${marker} -->" \
              'any(.[][]; (.body // "") | contains($marker))' \
              "${comments}"
          )"
          if [[ "${already_exists}" == "true" ]]; then
            echo "The daily improvement snapshot already exists."
            exit 0
          fi
          gh issue comment "${issue_number}" --body-file "${body}"
      - name: Create the next cycle
        if: steps.snapshot.outputs.mode == 'create'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.snapshot.outputs.title }}
        run: |
          set -euo pipefail

          title="${TITLE:?}"
          body="${RUNNER_TEMP:?}/improvement-cycle-body.md"
          gh issue create --title "${title}" --label improvement-cycle --body-file "${body}"
