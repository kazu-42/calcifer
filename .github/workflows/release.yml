name: Release

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - build.rs
      - Makefile
      - scripts/package_release.py
      - scripts/publish_release.py
      - scripts/generate_homebrew_formula.py
      - scripts/failover_scorecard.py
      - scripts/release_manifest.py
      - scripts/test_binstall_metadata.py
      - scripts/test_generate_homebrew_formula.py
      - scripts/test_failover_scorecard.py
      - scripts/test_package_release.py
      - scripts/test_publish_release.py
      - scripts/test_release_manifest.py
      - scripts/test_release_workflow.py
      - scripts/test_verify_release.py
      - scripts/verify_release.py
      - src/providers/codex/failover.rs
      - src/providers/codex/failover/scorecard.rs
      - tests/fixtures/failover-scorecard-codex.sh
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.96.0

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      tag_ref_digest: ${{ steps.version.outputs.tag_ref_digest }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component clippy --component rustfmt
          rustup toolchain install 1.85.0 --profile minimal
      - name: Read and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PUBLISH_EVENT: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          version="$(cargo +"${RUST_TOOLCHAIN}" metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "calcifer") | .version')"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Unable to read the Calcifer package version." >&2
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

          source_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          printf 'source_commit=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"
          release_channel="$(python3 - "${version}" <<'PY'
          import sys

          from scripts.release_manifest import release_channel

          print(release_channel(sys.argv[1]))
          PY
          )"
          if [[ "${release_channel}" == "preview" ]]; then
            printf 'prerelease=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'prerelease=false\n' >> "${GITHUB_OUTPUT}"
          fi

          if [[ "${IS_PUBLISH_EVENT}" == "true" ]] \
            && [[ "${GITHUB_REPOSITORY}" != "kazu-42/calcifer" ]]; then
            echo "Release draft staging is restricted to kazu-42/calcifer; found ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          if [[ "${IS_PUBLISH_EVENT}" != "true" ]]; then
            # No remote tag exists for PR/manual dry runs. This output is unused
            # unless the draft-staging job is enabled.
            printf 'tag_ref_digest=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version v${version}." >&2
            exit 1
          fi

          tag_ref_json="$(gh api --hostname github.com --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          tag_ref_digest="$(jq -r '.object.sha' <<<"${tag_ref_json}")"
          tag_ref_type="$(jq -r '.object.type' <<<"${tag_ref_json}")"
          if [[ ! "${tag_ref_digest}" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "${tag_ref_type}" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be an annotated Git tag object." >&2
            exit 1
          fi
          printf 'tag_ref_digest=%s\n' "${tag_ref_digest}" >> "${GITHUB_OUTPUT}"

          tagged_commit="$(gh api --hostname github.com --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" \
            --jq '.sha')"
          if [[ "${tagged_commit}" != "${source_commit}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} resolved to ${tagged_commit}, expected ${source_commit}." >&2
            exit 1
          fi

          release_commit="${source_commit}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${release_commit}" refs/remotes/origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi

          checks="$(gh api --hostname github.com --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${release_commit}/check-runs" \
            -f per_page=100)"
          required_checks=(
            "Quality"
            "Test (ubuntu-latest)"
            "Test (macos-latest)"
            "Test (windows-latest)"
            "Pinned Codex Package"
            "Failover Scorecard"
            "MSRV (1.85.0)"
          )
          for required_check in "${required_checks[@]}"; do
            if ! jq -e --arg name "${required_check}" \
              '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0' \
              <<<"${checks}" >/dev/null; then
              echo "Required check is not successful for ${release_commit}: ${required_check}" >&2
              exit 1
            fi
          done
      - name: Run repository quality gate
        run: make check

  failover-scorecard:
    name: Verify release failover scorecard
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
      - name: Build the public failover acceptance fixture
        run: >-
          cargo +"${RUST_TOOLCHAIN}" build --release --locked
          --features internal-failover-scorecard --bin calcifer
      - name: Run the exact-source guarded-failover matrix
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          python3 scripts/failover_scorecard.py \
            --calcifer target/release/calcifer \
            --fixture-codex tests/fixtures/failover-scorecard-codex.sh \
            --output target/failover-scorecard-v1.json \
            --source-commit "${SOURCE_COMMIT}"
      - name: Upload the exact-source redacted scorecard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failover-scorecard-release-v1
          path: target/failover-scorecard-v1.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            python: python3
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            python: python3
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            python: python3
          - target: aarch64-apple-darwin
            runner: macos-15
            python: python3
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup target add "${TARGET}" --toolchain "${RUST_TOOLCHAIN}"
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +"${RUST_TOOLCHAIN}" build --release --locked --target "${TARGET}"
      - name: Verify Linux glibc compatibility
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          binary="target/${TARGET}/release/calcifer"
          runner_glibc="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          if [[ "${runner_glibc}" != "2.35" ]]; then
            echo "Linux release runners must provide the documented glibc 2.35 baseline; found ${runner_glibc}." >&2
            exit 1
          fi

          required_glibc="$(
            readelf --version-info "${binary}" \
              | sed -nE 's/.*Name: GLIBC_([0-9]+(\.[0-9]+)+).*/\1/p' \
              | sort -Vu \
              | tail -n 1
          )"
          if [[ -z "${required_glibc}" ]]; then
            echo "Unable to determine the binary's required glibc symbol version." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${required_glibc}" "2.35" | sort -V | tail -n 1)" != "2.35" ]]; then
            echo "Binary requires GLIBC_${required_glibc}, newer than the documented 2.35 baseline." >&2
            exit 1
          fi

          {
            echo "### ${TARGET} runtime evidence"
            echo
            echo "- Native smoke-test runner glibc: ${runner_glibc}"
            echo "- Highest required binary symbol: GLIBC_${required_glibc}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Smoke test native binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${TARGET}" == *windows* ]]; then
            suffix=".exe"
          fi
          binary="./target/${TARGET}/release/calcifer${suffix}"
          actual_version="$("${binary}" --version)"
          if [[ "${actual_version}" != "calcifer ${VERSION}" ]]; then
            echo "Unexpected binary version: ${actual_version}" >&2
            exit 1
          fi
          "${binary}" --help >/dev/null
      - name: Package release archive
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          suffix=""
          if [[ "${TARGET}" == *windows* ]]; then
            suffix=".exe"
          fi
          "${PYTHON}" scripts/package_release.py \
            --binary "target/${TARGET}/release/calcifer${suffix}" \
            --output-dir dist \
            --target "${TARGET}" \
            --version "${VERSION}"
      - name: Smoke test packaged archive
        shell: bash
        env:
          PYTHON: ${{ matrix.python }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          prefix="calcifer-v${VERSION}-${TARGET}"
          smoke_root="${RUNNER_TEMP}/calcifer-release-smoke"
          rm -rf "${smoke_root}"
          mkdir -p "${smoke_root}"

          if [[ "${TARGET}" == *windows* ]]; then
            "${PYTHON}" -m zipfile -e "dist/${prefix}.zip" "${smoke_root}"
            binary="${smoke_root}/${prefix}/calcifer.exe"
          else
            tar -xzf "dist/${prefix}.tar.gz" -C "${smoke_root}"
            binary="${smoke_root}/${prefix}/calcifer"
          fi

          actual_version="$("${binary}" --version)"
          if [[ "${actual_version}" != "calcifer ${VERSION}" ]]; then
            echo "Unexpected packaged binary version: ${actual_version}" >&2
            exit 1
          fi
          "${binary}" --help >/dev/null
      - name: Upload target archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  bundle:
    name: Assemble release bundle
    needs:
      - validate
      - build
      - failover-scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download target archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate bundle and write checksums
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          TAG_REF_DIGEST: ${{ needs.validate.outputs.tag_ref_digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "calcifer-v${VERSION}-aarch64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "calcifer-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-x86_64-pc-windows-msvc.zip"
            "calcifer-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          )
          for archive in "${expected[@]}"; do
            if [[ ! -f "dist/${archive}" ]]; then
              echo "Missing release archive: ${archive}" >&2
              exit 1
            fi
          done
          archive_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${archive_count}" != "5" ]]; then
            echo "Expected exactly five release archives, found ${archive_count}." >&2
            exit 1
          fi

          python3 scripts/release_manifest.py \
            --dist dist \
            --output dist/calcifer-release-manifest-v1.json \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --tag-ref-digest "${TAG_REF_DIGEST}"

          checksum_assets=(
            "calcifer-release-manifest-v1.json"
            "${expected[@]}"
          )
          (
            cd dist
            LC_ALL=C sha256sum "${checksum_assets[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          python3 scripts/verify_release.py \
            --dist dist \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --tag-ref-digest "${TAG_REF_DIGEST}" \
            --local-only
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sign:
    name: Sign release archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist
      - name: Install checksum-pinned Minisign
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign-0.12-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73' \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" \
            minisign-linux/x86_64/minisign
          install -m 0755 \
            "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" \
            "${RUNNER_TEMP}/minisign"
      - name: Sign and verify every archive
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          TAG_REF_DIGEST: ${{ needs.validate.outputs.tag_ref_digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${MINISIGN_PRIVATE_KEY}" ]]; then
            echo "The protected release-signing environment did not provide MINISIGN_PRIVATE_KEY." >&2
            exit 1
          fi
          private_key="${RUNNER_TEMP}/calcifer-minisign.key"
          printf '%s\n' "${MINISIGN_PRIVATE_KEY}" > "${private_key}"
          unset MINISIGN_PRIVATE_KEY
          minisign="${RUNNER_TEMP}/minisign"
          public_key='RWScrwKKsqmN5v9pAGdgdW0jNSHokfmerI53KJiE2gRNmcaNS36gOtC6'
          archives=(
            "calcifer-v${VERSION}-aarch64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "calcifer-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-x86_64-pc-windows-msvc.zip"
            "calcifer-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          )
          for archive in "${archives[@]}"; do
            "${minisign}" -S -W \
              -s "${private_key}" \
              -m "dist/${archive}" \
              -x "dist/${archive}.sig"
            "${minisign}" -Vm "dist/${archive}" \
              -x "dist/${archive}.sig" \
              -P "${public_key}"
          done
          rm -f "${private_key}"

          checksum_assets=(
            "calcifer-release-manifest-v1.json"
            "${archives[@]}"
          )
          for archive in "${archives[@]}"; do
            checksum_assets+=("${archive}.sig")
          done
          (
            cd dist
            printf '%s\n' "${checksum_assets[@]}" \
              | LC_ALL=C sort \
              | xargs sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          python3 scripts/verify_release.py \
            --dist dist \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --tag-ref-digest "${TAG_REF_DIGEST}" \
            --local-only
      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Stage draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-bundle
          path: dist
      - name: Install checksum-pinned Minisign
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/minisign-0.12-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73' \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" \
            minisign-linux/x86_64/minisign
      - name: Reverify every archive signature
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          minisign="${RUNNER_TEMP}/minisign-linux/x86_64/minisign"
          public_key='RWScrwKKsqmN5v9pAGdgdW0jNSHokfmerI53KJiE2gRNmcaNS36gOtC6'
          archives=(
            "calcifer-v${VERSION}-aarch64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "calcifer-v${VERSION}-x86_64-apple-darwin.tar.gz"
            "calcifer-v${VERSION}-x86_64-pc-windows-msvc.zip"
            "calcifer-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          )
          for archive in "${archives[@]}"; do
            "${minisign}" -Vm "dist/${archive}" \
              -x "dist/${archive}.sig" \
              -P "${public_key}"
          done
      - name: Verify release bundle locally
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          TAG_REF_DIGEST: ${{ needs.validate.outputs.tag_ref_digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release.py \
            --dist dist \
            --version "${VERSION}" \
            --source-commit "${SOURCE_COMMIT}" \
            --tag-ref-digest "${TAG_REF_DIGEST}" \
            --local-only
      - name: Refuse to replace an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/publish_release.py \
            --dist dist \
            --tag "${TAG}" \
            --ci-assert-absent
      # This attests the exact assembled bytes after local semantic validation.
      # It is not a separate provenance statement emitted by each native build job.
      - name: Attest assembled release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Verify assembled-artifact attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          for asset in dist/*; do
            verified=false
            for attempt in {1..10}; do
              if gh attestation verify "${asset}" \
                --hostname github.com \
                --repo "${GITHUB_REPOSITORY}" \
                --signer-workflow "github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                --source-ref "${GITHUB_REF}" \
                --source-digest "${SOURCE_COMMIT}" \
                --deny-self-hosted-runners >/dev/null; then
                verified=true
                break
              fi
              if [[ "${attempt}" -lt 10 ]]; then
                sleep 3
              fi
            done
            if [[ "${verified}" != "true" ]]; then
              echo "Artifact attestation was not verifiable for ${asset} within the deadline." >&2
              exit 1
            fi
          done
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          TAG: ${{ github.ref_name }}
          TAG_REF_DIGEST: ${{ needs.validate.outputs.tag_ref_digest }}
        run: |
          set -euo pipefail
          current_tag_ref="$(gh api --hostname github.com --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha')"
          if [[ "${current_tag_ref}" != "${TAG_REF_DIGEST}" ]]; then
            echo "Tag ${TAG} ref digest is ${current_tag_ref}, expected ${TAG_REF_DIGEST}." >&2
            exit 1
          fi

          tag_commit="$(gh api --hostname github.com --method GET \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/commits/${TAG}" \
            --jq '.sha')"
          if [[ "${tag_commit}" != "${SOURCE_COMMIT}" ]]; then
            echo "Tag ${TAG} resolved to ${tag_commit}, expected ${SOURCE_COMMIT}." >&2
            exit 1
          fi

          release_args=(
            --repo "github.com/${GITHUB_REPOSITORY}"
            --verify-tag
            --target "${SOURCE_COMMIT}"
            --fail-on-no-commits
            --generate-notes
            --notes "Verify SHA256SUMS and GitHub artifact attestations before installation."
            --draft
            --latest=false
            --title "Calcifer ${TAG}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${TAG}" "${release_args[@]}"
      - name: Upload and verify draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* \
            --repo "github.com/${GITHUB_REPOSITORY}"
          draft_verified=false
          for attempt in {1..20}; do
            if python3 scripts/publish_release.py \
              --dist dist \
              --tag "${TAG}" \
              --ci-verify-draft; then
              draft_verified=true
              break
            fi
            if [[ "${attempt}" -lt 20 ]]; then
              sleep 3
            fi
          done
          if [[ "${draft_verified}" != "true" ]]; then
            echo "Draft release did not match the local bundle within the verification deadline." >&2
            exit 1
          fi
      - name: Record maintainer publication handoff
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "### Draft staged; no public release exists yet"
            echo
            echo "The tag workflow intentionally stops at a byte-verified draft."
            echo "A maintainer must use local admin gh authentication to verify repository controls and publish."
            echo
            echo '```console'
            echo "gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --name signed-release-bundle --dir dist"
            echo "python3 scripts/publish_release.py --dist dist --tag ${TAG}"
            echo "python3 scripts/publish_release.py --dist dist --tag ${TAG} --publish"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
